name: Release to TestFlight

# Builds a signed App Store archive and uploads it to TestFlight.
# Runs for every v* tag, or by hand from the Actions tab.
# Secrets and variables are documented in docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  # For actions/attest-build-provenance (keyless Sigstore signing of the .ipa).
  id-token: write
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check required secrets
        env:
          # Team-level credentials for signing and TestFlight upload.
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROFILE_BASE64 }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID \
                      APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64 \
                      IOS_DISTRIBUTION_CERT_P12_BASE64 IOS_DISTRIBUTION_CERT_PASSWORD \
                      IOS_APP_PROFILE_BASE64 IOS_EXTENSION_PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name (see docs/RELEASING.md)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more required secrets are not set. Nothing was built."
            exit 1
          fi
          echo "All required secrets are present."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Ruby and fastlane
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          bundler-cache: true

      # Follows GitHub's documented approach for signing on a hosted macOS
      # runner: decode the certificate and profiles from secrets into a
      # temporary keychain that is deleted at the end of the job. The
      # keychain password is generated here and never leaves the job.
      # https://docs.github.com/en/actions/how-tos/deploy/deploy-to-third-party-platforms/xcode
      - name: Install Apple certificate and provisioning profiles
        env:
          IOS_DISTRIBUTION_CERT_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERT_P12_BASE64 }}
          IOS_DISTRIBUTION_CERT_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERT_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_EXTENSION_PROFILE_BASE64: ${{ secrets.IOS_EXTENSION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo -n "$IOS_DISTRIBUTION_CERT_P12_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_DISTRIBUTION_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Xcode 16 reads profiles from the second directory; older tooling
          # (and some fastlane helpers) from the first. Install to both, named
          # by UUID as Xcode itself does.
          LEGACY_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          XCODE_DIR="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$LEGACY_DIR" "$XCODE_DIR"
          # Each profile's name is read from the profile itself and handed
          # to the Fastfile, so nothing has to be typed twice.
          install_profile() {
            local tmp="$RUNNER_TEMP/$1.mobileprovision"
            echo -n "$2" | base64 --decode -o "$tmp"
            local uuid name
            security cms -D -i "$tmp" > "$tmp.plist"
            uuid=$(plutil -extract UUID raw -o - "$tmp.plist")
            name=$(plutil -extract Name raw -o - "$tmp.plist")
            cp "$tmp" "$LEGACY_DIR/$uuid.mobileprovision"
            cp "$tmp" "$XCODE_DIR/$uuid.mobileprovision"
            echo "$3=$name" >> "$GITHUB_ENV"
            echo "Installed profile '$name' ($uuid)"
          }
          install_profile app "$IOS_APP_PROFILE_BASE64" APP_PROFILE_NAME
          install_profile extension "$IOS_EXTENSION_PROFILE_BASE64" EXTENSION_PROFILE_NAME

      - name: Build and upload to TestFlight
        env:
          # Team-level credentials for signing and TestFlight upload.
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          # GITHUB_RUN_NUMBER becomes CURRENT_PROJECT_VERSION (the build number).
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: bundle exec fastlane ios beta

      # Keyless (Sigstore) provenance: anyone can later verify that this
      # exact .ipa was built by this workflow from this commit.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: fastlane/builds/SembleShare.ipa

      - name: Upload build artefacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testflight-build-${{ github.run_number }}
          path: |
            fastlane/builds/*.ipa
            fastlane/builds/*.dSYM.zip
            fastlane/*.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove temporary keychain and profiles
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision \
                "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision \
                "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP"/*.plist "$RUNNER_TEMP"/distribution.p12
