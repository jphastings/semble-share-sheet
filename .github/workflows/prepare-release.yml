name: Prepare release

# Collects the change files merged since the last release into a "prepare
# release" pull request that writes CHANGELOG.md and bumps MARKETING_VERSION.
# Merging that PR is what actually releases: see tag-release.yml.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare-release:
    # The release PR's own merge commit would otherwise start this again.
    if: "!startsWith(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # knope needs the tags to know what the last release was.
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.23.0

      # knope exits non-zero when nothing is waiting to be released, which is
      # the usual state of a push to main. There is no flag to say "that's
      # fine", so the step is allowed to fail — at the cost of a real failure
      # (a bad token, say) also showing as a green run. Read the step's log if
      # an expected release PR doesn't appear.
      - run: knope prepare-release --verbose
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
